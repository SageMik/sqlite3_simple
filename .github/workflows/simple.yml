name: 编译 Simple 原生库

on:
  push:
    tags:
      - Nv*
  workflow_dispatch:

permissions:
  contents: write

env:
  SNAPSHOT: ${{ !startsWith(github.ref, 'refs/tags/Nv') }}

jobs:
  Windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: '安装 CMake'
        uses: lukka/get-cmake@v3.31.6

      - name: '获取 simple/vcpkg 的 commit id'
        id: vcpkg_commit
        run: |
          cd simple
          COMMIT_ID=$(git ls-tree HEAD vcpkg | awk '{print $3}')
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT
          echo "vcpkg commit id: $COMMIT_ID"
        shell: bash

      - name: '安装并配置 vcpkg'
        uses: lukka/run-vcpkg@v10
        with:
          vcpkgDirectory: simple/vcpkg
          vcpkgGitCommitId: ${{ steps.vcpkg_commit.outputs.commit_id }}

      - name: '复制 CMakePresets.json'
        run: |
          Copy-Item "simple/CMakePresets.json" "CMakePresets.json"
          $content = Get-Content "CMakePresets.json" -Raw
          $content = $content -replace '\$\{sourceDir\}/vcpkg/scripts/buildsystems/vcpkg\.cmake', '${sourceDir}/simple/vcpkg/scripts/buildsystems/vcpkg.cmake'
          Set-Content "CMakePresets.json" -Value $content -NoNewline
        shell: pwsh

      - name: '通过 CMake 编译'
        uses: lukka/run-cmake@v10
        continue-on-error: false
        with:
          configurePreset: 'windows-msvc-vs17'
          buildPreset: 'windows-msvc-vs17-release'

      - name: '重命名编译产物'
        run: |
          Copy-Item "../../_temp/windows-x64/simple/src/release/simple.dll" simple.dll
        shell: pwsh

      - name: '上传 Windows 产物'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: simple.dll


  Darwin:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: '安装 CMake'
        uses: lukka/get-cmake@v3.31.6

      - name: '复制 CMakePresets.json 到根目录'
        run: cp simple/CMakePresets.json CMakePresets.json
        shell: bash

      - name: '[MacOS] 编译动态库'
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'macos-ninja'
          buildPreset: 'macos-ninja-release'

      - name: '[MacOS] 保存动态库并清理缓存'
        run: |
          cp ../../_temp/macos/simple/src/libsimple.dylib libsimple-macos.dylib
          rm -rf ../../_temp/macos

      - name: '[MacOS] 编译静态库'
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'macos-ninja'
          configurePresetAdditionalArgs: "['-DBUILD_STATIC=ON']"
          buildPreset: 'macos-ninja-release'

      - name: '[MacOS] 保存静态库'
        run: cp ../../_temp/macos/simple/src/libsimple.a libsimple-macos.a

      - name: '[iOS] 编译真机和模拟器原生库'
        run: ./build-ios.sh

      - name: '[XCFramework] 打包 Apple 平台静态库'
        run: |
          mkdir -p xcf/ios xcf/ios-simulator xcf/macos
          cp libsimple-ios.a            xcf/ios/libsimple.a
          cp libsimple-ios-simulator.a  xcf/ios-simulator/libsimple.a
          cp libsimple-macos.a          xcf/macos/libsimple.a
          xcodebuild -create-xcframework \
            -library xcf/ios/libsimple.a -headers src/darwin/include \
            -library xcf/ios-simulator/libsimple.a -headers src/darwin/include \
            -library xcf/macos/libsimple.a -headers src/darwin/include \
            -output CSimple.xcframework
          zip -r CSimple.xcframework.zip CSimple.xcframework

      - name: '上传 Darwin 产物'
        uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            libsimple-macos.dylib
            libsimple-macos.a
            libsimple-ios.a
            libsimple-ios-simulator.a
            CSimple.xcframework.zip


  Android:
    runs-on: ubuntu-latest
    environment: simple-native-android

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: '设置 Android 环境'
        uses: android-actions/setup-android@v3

      - name: '通过 Gradle 编译'
        run: ./gradlew publishToMavenCentral --info
        working-directory: src/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ENABLE_TEST: false

      - name: '解压 aar 提取 so 库'
        run: |
          unzip -q src/android/simple-native-android/build/outputs/aar/simple-native-android-release.aar -d temp_aar
        shell: bash

      - name: '上传 Android 产物'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: temp_aar/jni/


  HarmonyOS:
    runs-on: ubuntu-latest
    environment: simple-native-ohos

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: '配置允许 node-pty 构建脚本'
        run: echo 'only-built-dependencies[]=node-pty' >> ~/.npmrc

      - name: '设置 HarmonyOS 环境'
        uses: ErBWs/setup-ohos@v1
        with:
          version: 6.0.0.858
          cache: true

      - name: '通过 Hvigor 编译'
        run: hvigorw --mode module -p product=default -p module=simple_native_ohos@default -p buildMode=release assembleHar --analyze=normal --parallel --incremental --daemon
        working-directory: src/ohos

      - name: '发布至 OpenHarmony 三方库'
        if: env.SNAPSHOT == 'false'
        run: hvigorw ohpmPublish --mode module -p product=default -p module=simple_native_ohos@default -p buildMode=release --analyze=normal --parallel --incremental --no-daemon
        env:
          OHPM_KEY: ${{ secrets.OHPM_KEY }}
          OHPM_KEY_PASSPHRASE: ${{ secrets.OHPM_KEY_PASSPHRASE }}
          OHPM_PUBLISH_ID: ${{ secrets.OHPM_PUBLISH_ID }}
        working-directory: src/ohos

      - name: '解压 har 提取 so 库'
        run: |
          mkdir -p temp_har
          tar -xvf src/ohos/simple_native_ohos/build/default/outputs/default/simple_native_ohos.har -C temp_har

      - name: '上传 HarmonyOS 产物'
        uses: actions/upload-artifact@v4
        with:
          name: ohos
          path: temp_har/package/libs/


  WebAssembly:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: '安装 WASI SDK'
        id: wasi-sdk
        uses: bytecodealliance/setup-wasi-sdk-action@b2de090b44eb70013ee96b393727d473b35e1728
        with:
          version: '33'

      - name: '安装 Binaryen'
        uses: Zxilly/setup-binaryen@v1.1.0
        with:
          version: '129'

      - name: '安装 Dart SDK'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.0'

      - name: '获取依赖'
        run: dart pub get
        working-directory: src/web

      - name: '构建 WASM'
        run: |
          dart run build_wasm.dart --wasi-sdk="${{ steps.wasi-sdk.outputs.wasi-sdk-path }}"
        working-directory: src/web

      - name: '上传 WebAssembly 产物'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            src/web/out/sqlite3.wasm
            src/web/out/sqlite3.debug.wasm
            src/web/out/sqlite3mc.wasm


  Package:
    runs-on: ubuntu-latest
    needs: [Windows, Darwin, Android, HarmonyOS, WebAssembly]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: '下载所有产物'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: '整理并打包'
        run: |
          mkdir -p dist/{windows,darwin,android,ohos,web}
          mkdir -p upload
          
          # Windows
          cp artifacts/windows/simple.dll   dist/windows/simple.dll
          cp artifacts/windows/simple.dll   upload/simple-windows-x64.dll

          # Darwin
          cp artifacts/darwin/libsimple-macos.dylib       dist/darwin/libsimple-macos.dylib
          cp artifacts/darwin/CSimple.xcframework.zip     dist/darwin/CSimple.xcframework.zip
          cp artifacts/darwin/libsimple-macos.dylib       upload/libsimple-macos-universal.dylib
          cp artifacts/darwin/libsimple-macos.a           upload/libsimple-macos-universal.a
          cp artifacts/darwin/libsimple-ios.a             upload/libsimple-ios-arm64.a
          cp artifacts/darwin/libsimple-ios-simulator.a   upload/libsimple-ios-simulator-universal.a
          cp artifacts/darwin/CSimple.xcframework.zip     upload/CSimple.xcframework.zip
          
          # Android
          cp -r artifacts/android/* dist/android/
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f artifacts/android/$arch/libsimple.so ]; then
              cp artifacts/android/$arch/libsimple.so upload/libsimple-android-$arch.so
            fi
          done
          
          # HarmonyOS
          cp -r artifacts/ohos/* dist/ohos/
          for arch in arm64-v8a x86_64; do
            if [ -f artifacts/ohos/$arch/libsimple.so ]; then
              cp artifacts/ohos/$arch/libsimple.so upload/libsimple-ohos-$arch.so
            fi
          done
          
          # WebAssembly
          cp -r artifacts/web/* dist/web/
          cp artifacts/web/sqlite3.wasm         upload/sqlite3.wasm
          cp artifacts/web/sqlite3.debug.wasm   upload/sqlite3.debug.wasm
          cp artifacts/web/sqlite3mc.wasm       upload/sqlite3mc.wasm
          
          cd dist && zip -r ../libsimple.zip .
        shell: bash

      - name: '提取 CHANGELOG 对应版本内容'
        id: changelog
        run: |
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          python scripts/extract_changelog.py "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: '准备 Release 名称'
        id: release_meta
        run: echo "name=simple-native ${GITHUB_REF_NAME#N}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: '上传最终产物到 Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_meta.outputs.name }}
          draft: true
          body: ${{ steps.changelog.outputs.release_notes }}
          files: |
            libsimple.zip
            upload/*
