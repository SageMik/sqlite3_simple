name: 发布 sqlite3_simple_core

on:
  push:
    tags:
      - 'core-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/release-package
        with:
          package-dir: packages/core
          # 新包首版只能本地手动发布
          skip-publish-version: '3.0.0'
