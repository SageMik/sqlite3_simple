name: 发布 sqlite3_simple

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/release-package
        with:
          package-dir: packages/flutter

  apk:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: 构建 Android APK
        run: flutter build apk --release
        working-directory: packages/flutter/example

      - name: 重命名 APK
        run: mv packages/flutter/example/build/app/outputs/flutter-apk/app-release.apk example.apk

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: example.apk
          draft: true
