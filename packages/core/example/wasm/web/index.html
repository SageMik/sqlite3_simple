<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sqlite3_simple_core - Web 示例</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>sqlite3_simple_core<span>Web 示例</span></h1>

    <p class="desc">
      在浏览器中通过 <code>DefaultSimpleWasmModuleLoader</code> 加载内置 Simple 分词器的
      <code>sqlite3.wasm</code>，演示中文 / 拼音全文搜索。
    </p>

    <label class="sr-only" for="query">搜索关键词</label>
    <input id="query" type="search" placeholder="输入关键词或拼音进行搜索"
           autocomplete="off" aria-describedby="tokenize" disabled>

    <p id="tokenize" aria-live="polite"></p>
    <div id="result" aria-live="polite"></div>
    <p id="status" role="status">正在加载 sqlite3.wasm …</p>

    <footer>
      <a href="https://github.com/SageMik/sqlite3_simple">SageMik/sqlite3_simple</a>
      · packages/core/example/wasm
    </footer>
  </main>

  <script src="main.dart.js" defer></script>
</body>
</html>
